name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
      - name: Pull and push image
        run: |
            docker pull --platform linux/amd64 eclipse-temurin:21-jre-alpine-3.23
            docker tag eclipse-temurin:21-jre-alpine-3.23 \
              registry.cn-shenzhen.aliyuncs.com/wzh994/eclipse-temurin:21-jre-alpine-3.23
            docker push \
              registry.cn-shenzhen.aliyuncs.com/wzh994/eclipse-temurin:21-jre-alpine-3.23
